services:

  # ── 백엔드 API ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argos-api-local
    environment:
      # 로컬 테스트용 — 실제 VM 없이도 실행됨 (연결 실패 시 빈 데이터로 동작)
      WAZUH_API: "https://localhost:55000"
      DB_NAME: "argos_security"
      DB_USER: "argos_app"
      DB_PASSWORD: "argos1234!"
      DB_HOST: "localhost"
      DB_PORT: "5432"
    ports:
      - "8000:8000"            # 직접 API 테스트용 (선택사항)
    restart: unless-stopped

  # ── 프론트엔드 (nginx) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argos-frontend-local
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
